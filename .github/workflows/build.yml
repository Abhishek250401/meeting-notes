name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip latest project zip
        run: |
          Z=$(ls Meeting-Notes-App*.zip | sort -V | tail -1)
          echo "Using $Z"
          unzip -o "$Z"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: meeting-notes
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp meeting-notes/app/build/outputs/apk/debug/app-debug.apk Meeting-Notes-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meeting Notes build ${{ github.run_number }}
          files: Meeting-Notes-${{ github.run_number }}.apk
          make_latest: true
